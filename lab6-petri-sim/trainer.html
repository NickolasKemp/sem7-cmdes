<div class="wrap">
  <header>
    <h1>Тренажер КП6</h1>
    <p class="sub">Моделі на алгоритмі PetriSim бібліотеки PetriObjModelPaint. Прогрес зберігається в цьому браузері: засвоєні питання більше не з’являються.</p>
  </header>
  <div class="overall"><span id="ovText">0 з 0 засвоєно</span><div class="track"><i id="ovBar" style="width:0"></i></div></div>
  <nav class="sections" id="sections" aria-label="Розділи"></nav>
  <details class="recap" id="recap"><summary id="recapTitle">Коротко про розділ</summary><ul id="recapList"></ul></details>
  <main class="card" id="card" aria-live="polite"></main>
  <div class="foot"><span id="hintKeys">Клавіші: 1–4 — варіант, Enter — далі</span><span id="resetZone"><button class="btn ghost" id="resetBtn">Скинути прогрес</button></span></div>
</div>

<script>
const SECTIONS=[
 {id:'basics',name:'PetriSim',recap:['Бібліотека PetriObjModelPaint: <code>PetriP</code> — позиція, <code>PetriT</code> — перехід, <code>ArcIn</code> / <code>ArcOut</code> — дуги, <code>PetriNet</code> — мережа, <code>PetriSim</code> — алгоритм імітації.','<code>input()</code> — вхід маркерів у переходи, доки є переходи з виконаною умовою запуску; <code>output()</code> — вихід маркерів з каналів, момент виходу яких настав.','Конфлікт (<code>doConflikt</code>): спершу найбільший пріоритет, серед рівних — вибір за ймовірністю; ймовірність 1 у всіх означає «порівну».','Перехід багатоканальний: <code>timeOut</code> — список моментів виходу, <code>buffer</code> — кількість зайнятих каналів.','Інформаційна дуга — <code>ArcIn</code> з ознакою <code>inf</code>: перевіряє маркери, не забирає.','Середній час = середня кількість / інтенсивність (Літтл).','Верифікація: інваріанти, рівняння станів, незалежне джерело, зміна параметрів.']},
 {id:'t1',name:'Завдання 1',recap:['Конвеєр з КП5 на PetriSim: 16 позицій, 11 переходів.','«Обробка i» (пріоритет 1) проти «Рух» (0) за позицію «Біля i».','Час перебування 9,45 ± 0,22 хв; у КП5 було 9,75 ± 0,18 — інтервали перекриваються.','Зайнято 3,995 пристрою; теорія λ·T = 4.','Інваріант: «Вільний i» + канали «Обробка i» = 1; порушень 0 на 1,6 млн подій.']},
 {id:'t2',name:'Завдання 2',recap:['Запаси холодильників з КП5 на PetriSim: 13 позицій, 11 переходів.','Інформаційна дуга ×54 з «Нестачі» в «Замовити»: умова «поточний стан ≤ 18».','Середній запас 29,04 ± 0,17 (КП5: 29,05); між втраченими продажами 2,36 тижня.','Інваріант: поточний стан запасу + нестача = 72.','10,8 % часу запасу немає — тоді й втрачаються продажі.']},
 {id:'t3',name:'Завдання 3',recap:['Два сервери: головний 12 потоків / 8 ядер / exp(16) мс, допоміжний 6 / 4 / exp(20) мс; спільна БД: 6 з’єднань, exp(8) мс.','Надходження exp(2) мс = 500 запитів/с; до допоміжного 0,3; черга ≤ 1000.','Потік зайнятий від «Прийняти» до «Відповідь», ядро — лише під час обчислень.','Час обробки 34,5 мс: головний 29,3, допоміжний 46,5.','Без обмеження потоків модель = теорія M/M/c: 31,65 проти 31,66 мс.','Межа ≈ 605 запитів/с; вузьке місце — потоки допоміжного сервера.']},
 {id:'t4',name:'Завдання 4',recap:['Пакет на кожну мережу: task.txt, net.png, net.pns, net.pnml, method.txt.','net.png малює метод редактора <code>paintGraphPetriNet</code>; net.pns — те, що пише Save GraphNet.','PNML пише <code>PnmlGenerator</code>, читає <code>PnmlParser</code>; після запису файл читається назад і порівнюється з мережею.','method.txt — метод <code>CreateNet…</code> зі списками <code>d_P</code>, <code>d_T</code>, <code>d_In</code>, <code>d_Out</code>.']},
 {id:'t5',name:'Завдання 5',recap:['N = (P, T, A, W, K, I, R); стан S(t) = (M(t), E(t)).','tₙ = min τ(tₙ₋₁); S(tₙ) = (D⁻)ᵐ(D⁺(S(tₙ₋₁))).','D⁺: M⁺ = M′ + Σ Y·s (вихід маркерів); D⁻: M = M⁺ − Σ u (вхід маркерів).','Z(T, tₙ) = 1, якщо в кожній вхідній позиції M⁺ ≥ кратність дуги.','Матричні: μ(tₙ) = μ(t₀) + a·γ(tₙ), μ = M + a⁺·v; η = γ − v + v(t₀).','S-інваріант: aᵀ·w = 0 → wᵀ·μ стала (потоки, ядра, з’єднання, місця).']}
];

const Q=[
 {id:'b-classes',s:'basics',type:'mc',q:'Який клас бібліотеки PetriObjModelPaint виконує алгоритм імітації мережі Петрі?',o:['<code>PetriNet</code>','<code>PetriSim</code>','<code>PetriT</code>','<code>GraphPetriNet</code>'],a:1,e:'<code>PetriNet</code> лише зберігає позиції, переходи й дуги. <code>PetriSim</code> бере мережу і просуває її в часі.'},
 {id:'b-input',s:'basics',type:'mc',q:'Що робить метод <code>PetriSim.input()</code>?',o:['Читає мережу з файла','Здійснює вхід маркерів у переходи, доки є переходи з виконаною умовою запуску','Здійснює вихід маркерів з переходів','Просуває час'],a:1,e:'У циклі: <code>findActiveT()</code> → <code>doConflikt()</code> → <code>actIn()</code>, доки список активних переходів не спорожніє.'},
 {id:'b-order',s:'basics',type:'mc',q:'Правильний порядок одного кроку алгоритму після початкового входу маркерів?',o:['вхід → вихід → час','час до найближчої події → вихід маркерів → вхід маркерів','вихід → час → вхід','час → вхід → вихід'],a:1,e:'<code>getTimeMin()</code> дає момент найближчої події, <code>output()</code> випускає маркери, <code>input()</code> знову запускає переходи.'},
 {id:'b-conf',s:'basics',type:'mc',q:'Як <code>doConflikt</code> вибирає перехід серед кількох готових?',o:['Перший у списку','Найбільший пріоритет; серед рівних — випадково за ймовірністю','Найменша затримка','Випадково серед усіх'],a:1,e:'Список сортується за спаданням пріоритету. У верхній групі перехід вибирається за ймовірністю запуску.'},
 {id:'b-prob1',s:'basics',type:'num',q:'Три готові переходи мають однаковий пріоритет і ймовірність 1,0 кожен. З якою ймовірністю (у відсотках) буде вибрано перший?',a:33.3,tol:0.02,h:'ймовірність 1 означає «порівну»',e:'Якщо ймовірність 1, бібліотека бере 1 / кількість суперників = 33,3 %.'},
 {id:'b-multi',s:'basics',type:'mc',q:'У переході <code>PetriT</code> поле <code>buffer</code> дорівнює 4. Що це означає?',o:['Затримка 4','У переході зараз 4 зайняті канали — 4 маркери чекають виходу','Пріоритет 4','Кратність дуги 4'],a:1,e:'Кожен вхід додає момент виходу в список <code>timeOut</code>; <code>buffer</code> — їх кількість.'},
 {id:'b-inf',s:'basics',type:'mc',q:'Як у бібліотеці задати інформаційну дугу?',o:['<code>new ArcOut(t, p, k)</code>','<code>new ArcIn(p, t, k, true)</code> або <code>setInf(true)</code>','Окремим класом <code>ArcInfo</code>','Ніяк, їх немає'],a:1,e:'Ознака <code>inf</code> у вхідної дуги: умова перевіряється, маркери лишаються.'},
 {id:'b-little',s:'basics',type:'num',q:'У системі в середньому 17,2 запиту, проходить 0,5 запиту за мілісекунду. Середній час у системі, мс?',a:34.4,tol:0.02,h:'L / λ',e:'Формула Літтла: 17,2 / 0,5 = 34,4 мс.'},
 {id:'b-stat',s:'basics',type:'mc',q:'Чому статистику зібрано у власному циклі, а не методом <code>doStatistics()</code>?',o:['Він не працює','Щоб рахувати після періоду розгону і для довільних функцій стану','Так швидше','Так вимагає редактор'],a:1,e:'<code>PetriSim</code> рахує середні лише від нуля. Власний цикл викликає ті самі <code>input()</code> / <code>output()</code>.'},
 {id:'b-verif',s:'basics',type:'mc',q:'Що НЕ входило у верифікацію моделей?',o:['Перевірка інваріантів у кожний момент подій','Перевірка матричних рівнянь станів','Порівняння з незалежним джерелом','Порівняння з вимірюваннями реальної системи'],a:3,e:'Порівняння з реальною системою — це валідація. Верифікація перевіряє, що модель працює так, як задумано.'},

 {id:'t1-conf',s:'t1',type:'mc',q:'Пристрій 2 зайнятий, біля нього деталь. Що запуститься?',o:['«Обробка2» — у неї пріоритет','«Рух23»: умова «Обробка2» не виконана, бо «Вільний2» порожня','Нічого, деталь чекає','Обидва переходи'],a:1,e:'Пріоритет діє лише серед переходів з виконаною умовою. Без маркера «Вільний2» обробка не в списку.'},
 {id:'t1-busy',s:'t1',type:'num',q:'Надходить 4 деталі за хвилину, обробка в середньому 1 хв. Скільки пристроїв зайнято в середньому?',a:4,tol:0.02,h:'λ · T',e:'λ·T = 4. Модель дала 3,995 ± 0,011.'},
 {id:'t1-res',s:'t1',type:'mc',q:'Середній час перебування деталі в моделі на PetriSim?',o:['≈ 1 хв','≈ 4 хв','≈ 9,5 хв','≈ 37 хв'],a:2,e:'9,45 ± 0,22 хв. У КП5 — 9,75 ± 0,18: інтервали перекриваються.'},
 {id:'t1-inv',s:'t1',type:'mc',q:'Який інваріант перевірявся для кожного пристрою?',o:['«Біля i» ≤ 1','«Вільний i» + зайняті канали «Обробка i» = 1','«Готово i» зростає','«Вільний i» = 1'],a:1,e:'Пристрій або вільний, або обробляє одну деталь. Порушень 0 на 1,6 млн моментів подій.'},
 {id:'t1-var',s:'t1',type:'mc',q:'Обробку сповільнили до exp(1,2). Що сталося?',o:['Нічого','Потрібно 4,8 пристрою з 5: деталі кружляють, ≈ 41 повернення на деталь','Система стала швидшою','Деталі губляться'],a:1,e:'Система на межі: час перебування виріс до сотень хвилин.'},
 {id:'t1-why',s:'t1',type:'mc',q:'Навіщо порівнювати з результатами КП5?',o:['Для обсягу звіту','Дві незалежні реалізації (Java і TypeScript) з однаковим результатом підтверджують і мережу, і алгоритми','Так вимагає редактор','Щоб знайти швидшу'],a:1,e:'Збіг у межах довірчих інтервалів — сильна перевірка: помилка мала б бути однаковою в обох.'},

 't5-u':{ef:{w:380,h:160,cap:'після входу: M(Готовий1) = 2, M(Ядра1) = 0, у переході 3 канали',P:[['q',50,105,2,'Готовий1','b'],['k',190,30,0,'Ядра1','r'],['o',330,105,0,'Обчислено1','b']],T:[['t',190,105,'Обчислення1 · u = 3','b',1]],A:[['q','t'],['k','t',1,'',[[168,62]]],['t','k',1,'',[[212,62]]],['t','o']]}}
};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
function drawPetri(f){
  const R=14,BW=6,BH=34,el={},o=[];
  for(const [id,x,y,tk,l,pos] of f.P)el[id]={p:1,x,y,tk,l,pos:pos||'b'};
  for(const [id,x,y,l,pos,hl] of f.T)el[id]={p:0,x,y,l,pos:pos||'a',hl};
  const clip=(e,[tx,ty])=>{const dx=tx-e.x,dy=ty-e.y,len=Math.hypot(dx,dy)||1;
    if(e.p)return[e.x+dx/len*R,e.y+dy/len*R];
    const s=Math.min(dx?BW/2/Math.abs(dx):1e9,dy?BH/2/Math.abs(dy):1e9);return[e.x+dx*s,e.y+dy*s];};
  for(const [a,b,w=1,st='',via=[],lab] of f.A){
    const s=el[a],t=el[b],pts=[clip(s,via[0]||[t.x,t.y]),...via,clip(t,via.length?via[via.length-1]:[s.x,s.y])];
    o.push(`<path d="${pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}" fill="none" stroke="currentColor" stroke-width="1.4"${st==='d'?' stroke-dasharray="5 4"':''}${st==='p'?'':' marker-end="url(#ah)"'}/>`);
    const [p,q]=[pts[pts.length-2],pts[pts.length-1]],m=[p[0]+(q[0]-p[0])*.5,p[1]+(q[1]-p[1])*.5];
    if(w!==1){o.push(`<path d="M${m[0]-4},${m[1]+6}L${m[0]+4},${m[1]-6}" stroke="currentColor" stroke-width="1.4"/>`,`<text x="${m[0]+7}" y="${m[1]-6}" class="fw">${esc(w)}</text>`);}
    if(lab)o.push(`<text x="${m[0]}" y="${m[1]-7}" text-anchor="middle" class="fw">${esc(lab)}</text>`);
  }
  for(const e of Object.values(el)){
    const hl=e.hl?' class="hl"':'';
    if(e.p){o.push(`<circle cx="${e.x}" cy="${e.y}" r="${R}" fill="var(--surface)" stroke="currentColor" stroke-width="1.5"/>`);
      if(e.tk===1)o.push(`<circle cx="${e.x}" cy="${e.y}" r="3.2" fill="currentColor"/>`);
      else if(e.tk)o.push(`<text x="${e.x}" y="${e.y+4.5}" text-anchor="middle" class="fw">${esc(e.tk)}</text>`);}
    else o.push(`<rect x="${e.x-BW/2}" y="${e.y-BH/2}" width="${BW}" height="${BH}"${hl} fill="currentColor"/>`);
    if(!e.l)continue;
    const ls=e.l.split('\n'),off=e.p?R:BH/2,n=ls.length;
    const [x,y0,anc]=e.pos==='a'?[e.x,e.y-off-6-(n-1)*13,'middle']:e.pos==='b'?[e.x,e.y+off+14,'middle']:e.pos==='l'?[e.x-(e.p?R:BW)-6,e.y+4-(n-1)*6.5,'end']:[e.x+(e.p?R:BW)+6,e.y+4-(n-1)*6.5,'start'];
    ls.forEach((t,i)=>o.push(`<text x="${x}" y="${y0+i*13}" text-anchor="${anc}"${e.hl?' class="hlt"':''}>${esc(t)}</text>`));
  }
  return `<svg viewBox="0 0 ${f.w} ${f.h}" width="${f.w}" role="img"><defs><marker id="ah" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" fill="currentColor"/></marker></defs>${o.join('')}</svg>`;
}
function drawBars(f){
  const rowH=26,lw=96,bw=200,h=f.bars.length*rowH+6;
  const rows=f.bars.map(([l,v,hl],i)=>{const y=i*rowH+4,w=v/f.max*bw;
    return `<text x="${lw-8}" y="${y+14}" text-anchor="end">${esc(l)}</text><rect x="${lw}" y="${y+2}" width="${Math.max(w,1.5)}" height="16" rx="3" class="${hl?'barhl':'bar'}"/><text x="${lw+w+6}" y="${y+14}" class="fw">${String(v).replace('.',',')}${esc(f.unit||'')}</text>`;}).join('');
  return `<svg viewBox="0 0 ${lw+bw+90} ${h}" width="${lw+bw+90}" role="img">${rows}</svg>`;
}
const figure=f=>f?`<figure class="fig">${f.bars?drawBars(f):drawPetri(f)}${f.cap?`<figcaption>${esc(f.cap)}</figcaption>`:''}</figure>`:'';

const KEY='kp6-trainer-v1';
let st={mastered:{},misses:{},retryQueue:[]};
try{const raw=localStorage.getItem(KEY);if(raw){const p=JSON.parse(raw);st={mastered:p.mastered||{},misses:p.misses||{},retryQueue:p.retryQueue||[]};}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st));}catch(e){}};
let filter=null,cur=null,answered=false;
const $=id=>document.getElementById(id);
const byId=Object.fromEntries(Q.map(x=>[x.id,x]));
const pool=()=>Q.filter(x=>!filter||x.s===filter);

function pick(){
  const open=pool().filter(x=>!st.mastered[x.id]);
  if(!open.length)return null;
  const fresh=open.filter(x=>!st.retryQueue.includes(x.id));
  if(fresh.length)return fresh[0];
  return byId[st.retryQueue.find(id=>open.some(x=>x.id===id))];
}
function renderNav(){
  const total=Q.length,done=Q.filter(x=>st.mastered[x.id]).length;
  $('ovText').textContent=`${done} з ${total} засвоєно`;$('ovBar').style.width=(done/total*100)+'%';
  $('sections').innerHTML=[{id:null,name:'Усе підряд'},...SECTIONS].map(s=>{
    const qs=Q.filter(x=>!s.id||x.s===s.id),d=qs.filter(x=>st.mastered[x.id]).length;
    return `<button class="sec${d===qs.length?' done':''}" data-s="${s.id??''}" aria-pressed="${filter===s.id}"><b>${s.name}</b><span>${d} / ${qs.length}</span><div class="mini"><i style="width:${d/qs.length*100}%"></i></div></button>`;
  }).join('');
  const sec=SECTIONS.find(s=>s.id===(filter??cur?.s));
  $('recap').hidden=!sec;
  if(sec){$('recapTitle').textContent=`Коротко: ${sec.name.toLowerCase()}`;$('recapList').innerHTML=sec.recap.map(r=>`<li>${r}</li>`).join('');}
}
function render(){
  answered=false;cur=pick();renderNav();
  if(!cur)return renderEnd();
  const sec=SECTIONS.find(s=>s.id===cur.s),retry=st.retryQueue.includes(cur.id);
  $('card').innerHTML=`<div class="meta"><span class="pill sec-pill">${sec.name}</span><span class="pill">${cur.type==='num'?'порахуй':'вибери'}</span>${retry?'<span class="pill retry">повтор помилки</span>':''}</div>
  <p class="q">${cur.q}</p>
  ${figure(FIG[cur.id]?.img)}
  ${cur.type==='mc'?`<div class="opts" id="opts">${cur.o.map((t,k)=>`<button class="opt" data-k="${k}">${k+1}. ${t}</button>`).join('')}</div>`
  :`<div class="numrow"><input type="number" id="ans" step="any" inputmode="decimal" placeholder="Число" aria-label="Відповідь"><button class="btn" id="check">Перевірити</button></div>`}
  <div class="exp" id="exp" hidden></div>
  <div class="actions"><button class="btn primary" id="next">Далі</button>${cur.h?'<button class="btn" id="hint">Підказка</button>':''}<button class="btn ghost" id="skip">Я це знаю — пропустити</button><span class="err" id="err"></span></div>`;
  if(cur.type==='mc')$('opts').onclick=e=>{const b=e.target.closest('.opt');if(b)answerMc(+b.dataset.k);};
  else{$('check').onclick=answerNum;$('ans').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();e.stopPropagation();answered?next():answerNum();}});$('ans').oninput=()=>{$('err').textContent='';};$('ans').focus({preventScroll:true});}
  $('next').onclick=next;$('skip').onclick=()=>{st.mastered[cur.id]=true;st.retryQueue=st.retryQueue.filter(id=>id!==cur.id);save();render();};
  if(cur.h)$('hint').onclick=()=>{const ex=$('exp');if(answered)return;ex.hidden=false;ex.className='exp';ex.innerHTML='<strong>Підказка.</strong> '+cur.h;};
}
function result(ok,shown){
  answered=true;
  if(ok){st.mastered[cur.id]=true;st.retryQueue=st.retryQueue.filter(id=>id!==cur.id);}
  else{st.misses[cur.id]=(st.misses[cur.id]||0)+1;st.retryQueue=[...st.retryQueue.filter(id=>id!==cur.id),cur.id];}
  save();
  const ex=$('exp');ex.hidden=false;ex.className='exp '+(ok?'ok':'bad');
  ex.innerHTML=(ok?'<strong>Правильно.</strong> ':`<strong>Ні${shown?', правильно '+shown:''}.</strong> `)+cur.e+(ok?'':' Питання повернеться пізніше.')+figure(FIG[cur.id]?.ef);
  $('skip').hidden=true;const h=$('hint');if(h)h.hidden=true;$('err').textContent='';
  $('next').focus({preventScroll:true});
}
function answerMc(k){
  if(answered)return;
  [...$('opts').children].forEach((b,j)=>{b.disabled=true;if(j===cur.a)b.classList.add('ok');else if(j===k)b.classList.add('bad');});
  result(k===cur.a);
}
function answerNum(){
  if(answered)return;const v=$('ans').value.trim().replace(',','.');
  if(v===''||isNaN(+v)){$('err').textContent='Введи число';return;}
  const n=+v,ok=cur.tol?Math.abs(n-cur.a)/cur.a<=cur.tol:n===cur.a;
  $('ans').classList.add(ok?'ok':'bad');$('ans').disabled=true;$('check').disabled=true;
  result(ok,cur.a.toLocaleString('uk-UA'));
}
function next(){if(!answered){$('err').textContent='Спершу дай відповідь або натисни «Я це знаю»';return;}render();}
function renderEnd(){
  const qs=pool(),weak=qs.filter(x=>st.misses[x.id]).sort((a,b)=>st.misses[b.id]-st.misses[a.id]).slice(0,5);
  const name=filter?SECTIONS.find(s=>s.id===filter).name:'Уся робота';
  $('card').innerHTML=`<div class="end" style="display:flex;flex-direction:column;gap:12px"><h2>${name}: засвоєно</h2>
  <p style="margin:0;color:var(--muted)">${weak.length?'Де помилявся найчастіше — варто перечитати пояснення:':'Без жодної помилки.'}</p>
  ${weak.length?`<ul class="weak">${weak.map(x=>`<li>${x.q} — помилок: ${st.misses[x.id]}</li>`).join('')}</ul>`:''}
  <div class="actions">${filter?'<button class="btn primary" id="toAll">До всієї роботи</button>':''}<button class="btn" id="again">Пройти ${filter?'розділ':'все'} ще раз</button></div></div>`;
  if(filter)$('toAll').onclick=()=>{filter=null;render();};
  $('again').onclick=()=>{qs.forEach(x=>{delete st.mastered[x.id];});st.retryQueue=st.retryQueue.filter(id=>!qs.some(x=>x.id===id));save();render();};
}
$('sections').onclick=e=>{const b=e.target.closest('.sec');if(!b)return;filter=b.dataset.s||null;render();};
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(cur&&cur.type==='mc'&&!answered&&/^[1-4]$/.test(e.key)&&+e.key<=cur.o.length){answerMc(+e.key-1);}
  else if(e.key==='Enter'&&answered&&document.activeElement?.id!=='next'){next();}
});
function resetZone(){
  $('resetZone').innerHTML='<button class="btn ghost" id="resetBtn">Скинути прогрес</button>';
  $('resetBtn').onclick=()=>{$('resetZone').innerHTML='<span class="confirm">Стерти весь прогрес? <button class="btn" id="yes">Стерти</button><button class="btn ghost" id="no">Скасувати</button></span>';
    $('yes').onclick=()=>{st={mastered:{},misses:{},retryQueue:[]};save();filter=null;resetZone();render();};$('no').onclick=resetZone;};
}
resetZone();render();
</script>
